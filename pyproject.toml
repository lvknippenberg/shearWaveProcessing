[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "shearwaveprocessing"
version = "0.1.0"
description = "Unified cardiac shear-wave elastography processing: Verasonics .mat -> zea IQ -> shear-wave space-time plots (active + passive SWE)."
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "h5py>=3.8",
    "imageio>=2.28",
    "pyyaml>=6.0",
    "hdf5plugin>=4.0",
    # zea (the tue-bmd toolbox) is required for stages 1-2 (conversion + beamforming).
    # Install it from the group's fork/environment; not pinned here.
]

[project.optional-dependencies]
gpu = ["torch"]
dev = ["pytest"]
gui = ["streamlit>=1.30"]     # interactive method-exploration GUI (swp_gui/)

[tool.setuptools.packages.find]
where = ["src"]
