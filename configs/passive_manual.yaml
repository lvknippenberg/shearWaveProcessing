# shearWaveProcessing -- PASSIVE SWE, manual study reading (scripts/passive_manual.py).
#
# Same data, detection and default recipe as configs/passive.yaml, with two differences:
#   * outputs go to <folder>/output/swp_passive_manual/ - the earlier passive runs
#     (swp_passive/, mlines/) are never touched;
#   * FIVE processing views per window, all read together when the slope is drawn:
#       1. displacement, Gaussian    (passive_v1 view A)
#       2. velocity, median          (passive.yaml view C)
#       3. velocity, Gaussian        (passive.yaml view A, the default)
#       4. Keijzer velocity          (literature: IQ low-pass 250 Hz, Gaussian autocorrelation
#                                     kernel, 15-100 Hz)
#       5. Petrescu/Santos acceleration (literature: velocity mean 3, then derivative)
#     Recipes 4-5 use different filters from 1-3, so a slope that holds on them is not an
#     artefact of our own filter choices. Definitions match
#     study/analysis/passive_methods_atlas.py ("literature" family).

data:
  root: ""                                  # set per folder to <folder>/output
  grid_dir: ""
  file: "CombinedData_buffer4_iq.hdf5"
  bmode: "CombinedData_buffer4_iq.hdf5"
  ecg: null

mline:
  type: manual
  npz: "mlines/passive_mline.npz"           # unused by the manual study (it keeps its own lines)
  n_samples: 250
  offsets: 5
  offset_step_mm: 0.5

focus:
  mode: auto

pipeline:
  estimator: loupas
  estimator_params: {}
  mode: frame_to_frame
  quantity: velocity
  drop_first: 1
  iq_filters: []
  field_filters:
    - {name: temporal_bandpass, params: {f_lo: 15, f_hi: 150}}
    - {name: spatial_smooth, params: {sigma_z_mm: 0.6, sigma_x_mm: 1.2}}
    - {name: temporal_moving_mean, params: {window: 3}}
  directional: false
  directional_mode: leftward
  speed: ttp_ransac

# Burst detection: identical to configs/passive.yaml (fixed band and quantity, phase-aware).
detect:
  band: [5, 150]
  quantity: displacement
  mode: phase

run:
  measurement: 0
  outdir: "swp_passive_manual"
  bands: [[5, 150]]

  views:
    - name: "displacement gauss"
      quantity: displacement
      directional: false
      offsets: 5
      offset_step_mm: 0.5
      field_filters:
        - {name: temporal_bandpass, params: {f_lo: 10, f_hi: 150}}
        - {name: spatial_smooth, params: {sigma_z_mm: 0.6, sigma_x_mm: 1.2}}
        - {name: temporal_moving_mean, params: {window: 3}}

    - name: "velocity median"
      quantity: velocity
      directional: false
      offsets: 5
      offset_step_mm: 0.5
      field_filters:
        - {name: temporal_bandpass, params: {f_lo: 15, f_hi: 150}}
        - {name: spatial_median, params: {size_z_mm: 1.0, size_x_mm: 2.0}}
        - {name: temporal_moving_mean, params: {window: 3}}

    - name: "velocity gauss"
      quantity: velocity
      directional: false
      offsets: 5
      offset_step_mm: 0.5
      field_filters:
        - {name: temporal_bandpass, params: {f_lo: 15, f_hi: 150}}
        - {name: spatial_smooth, params: {sigma_z_mm: 0.6, sigma_x_mm: 1.2}}
        - {name: temporal_moving_mean, params: {window: 3}}

    - name: "Keijzer velocity"
      quantity: velocity
      directional: false
      offsets: 5
      offset_step_mm: 0.5
      iq_filters:
        - {name: iq_slowtime_lowpass, params: {fc_hz: 250.0, order: 3}}
      estimator_params: {kernel_z_mm: 4.0, kernel_x_mm: 3.0, kernel_shape: gaussian}
      field_filters:
        - {name: temporal_bandpass, params: {f_lo: 15, f_hi: 100, order: 3}}

    - name: "acceleration"
      quantity: acceleration
      directional: false
      offsets: 5
      offset_step_mm: 0.5
      field_filters:
        - {name: temporal_moving_mean, params: {window: 3}}
        - {name: temporal_bandpass, params: {f_lo: 10, f_hi: 150}}
        - {name: spatial_smooth, params: {sigma_z_mm: 0.6, sigma_x_mm: 1.2}}
