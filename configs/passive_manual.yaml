# shearWaveProcessing -- PASSIVE SWE, manual study reading (scripts/passive_manual.py).
#
# Same data, detection and default recipe as configs/passive.yaml, with two differences:
#   * outputs go to <folder>/output/swp_passive_manual/ - the earlier passive runs
#     (swp_passive/, mlines/) are never touched;
#   * FIVE processing views per window, all read together when the slope is drawn:
#       1. displacement, Gaussian    (passive_v1 view A)
#       2. velocity, median          (passive.yaml view C)
#       3. velocity, Gaussian        (passive.yaml view A, the default)
#       4. Keijzer velocity          (literature: IQ low-pass 250 Hz, Gaussian autocorrelation
#                                     kernel, 15-100 Hz)
#       5. Petrescu/Santos acceleration (literature: velocity mean 3, then derivative)
#     Recipes 4-5 use different filters from 1-3, so a slope that holds on them is not an
#     artefact of our own filter choices. Definitions match
#     study/analysis/passive_methods_atlas.py ("literature" family).

data:
  root: ""                                  # set per folder to <folder>/output
  grid_dir: ""
  file: "CombinedData_buffer4_iq.hdf5"
  bmode: "CombinedData_buffer4_iq.hdf5"
  ecg: null

mline:
  type: manual
  npz: "mlines/passive_mline.npz"           # unused by the manual study (it keeps its own lines)
  n_samples: 250
  offsets: 5
  offset_step_mm: 0.5

focus:
  mode: auto

pipeline:
  estimator: loupas
  estimator_params: {}
  mode: frame_to_frame
  quantity: velocity
  drop_first: 1
  iq_filters: []
  field_filters:
    - {name: temporal_bandpass, params: {f_lo: 15, f_hi: 150}}
    - {name: spatial_smooth, params: {sigma_z_mm: 0.6, sigma_x_mm: 1.2}}
    - {name: temporal_moving_mean, params: {window: 3}}
  directional: false
  directional_mode: leftward
  speed: ttp_ransac

# Burst detection. Phase windows as configs/passive.yaml (MVC R+0-150 ms, AVC QS2 +-120 ms), time
# picked by displacement energy, plus since 2026-09-29 (swp.passive_screen):
#   * min_inside: a search window less than this fraction inside the recording is dropped (the
#     second AVC of a ~1 s recording lies after its end; it used to be "found" on zero energy);
#   * screen: score every picked window by the slant-stack semblance of screen_view along the
#     GENERAL line; below screen_min the window is "screened" - no event line is asked
#     (session --include-screened asks them anyway).
# picker: semblance (pick the time by that score) was tried and rejected - see
# docs/passive_manual_prelim_2026-09-29.md. Folders detected before 2026-09-29 keep their windows.
#
# picker: valves (the DEFAULT since 2026-10-01, swp.passive_valves): MVC / AVC only, fitted to the
# ROIs marked by eye. In each search window, the peak of the 20 ms along-line energy of screen_view
# (weighted by the typical timing) gets a fixed window_ms window; below screen_min it is screened.
# The windows are then REVIEWED by hand in the session (moved / added / deleted) before the event
# lines. band / quantity / mode / top_up / screen apply to picker: energy only. Folders detected
# with picker: energy keep their windows until `passive_manual.py redetect`.
detect:
  band: [5, 150]
  quantity: displacement
  mode: phase
  picker: valves
  window_ms: 120
  min_inside: 0.5
  top_up: true                # fill to 4 windows with the largest other energy bursts (as before)
  screen: true
  screen_view: "velocity gauss"
  screen_min: 0.3

run:
  measurement: 0
  outdir: "swp_passive_manual"
  bands: [[5, 150]]

  views:
    - name: "displacement gauss"
      quantity: displacement
      directional: false
      offsets: 5
      offset_step_mm: 0.5
      field_filters:
        - {name: temporal_bandpass, params: {f_lo: 10, f_hi: 150}}
        - {name: spatial_smooth, params: {sigma_z_mm: 0.6, sigma_x_mm: 1.2}}
        - {name: temporal_moving_mean, params: {window: 3}}

    - name: "velocity median"
      quantity: velocity
      directional: false
      offsets: 5
      offset_step_mm: 0.5
      field_filters:
        - {name: temporal_bandpass, params: {f_lo: 15, f_hi: 150}}
        - {name: spatial_median, params: {size_z_mm: 1.0, size_x_mm: 2.0}}
        - {name: temporal_moving_mean, params: {window: 3}}

    - name: "velocity gauss"
      quantity: velocity
      directional: false
      offsets: 5
      offset_step_mm: 0.5
      field_filters:
        - {name: temporal_bandpass, params: {f_lo: 15, f_hi: 150}}
        - {name: spatial_smooth, params: {sigma_z_mm: 0.6, sigma_x_mm: 1.2}}
        - {name: temporal_moving_mean, params: {window: 3}}

    - name: "Keijzer velocity"
      quantity: velocity
      directional: false
      offsets: 5
      offset_step_mm: 0.5
      iq_filters:
        - {name: iq_slowtime_lowpass, params: {fc_hz: 250.0, order: 3}}
      estimator_params: {kernel_z_mm: 4.0, kernel_x_mm: 3.0, kernel_shape: gaussian}
      field_filters:
        - {name: temporal_bandpass, params: {f_lo: 15, f_hi: 100, order: 3}}

    - name: "acceleration"
      quantity: acceleration
      directional: false
      offsets: 5
      offset_step_mm: 0.5
      field_filters:
        - {name: temporal_moving_mean, params: {window: 3}}
        - {name: temporal_bandpass, params: {f_lo: 10, f_hi: 150}}
        - {name: spatial_smooth, params: {sigma_z_mm: 0.6, sigma_x_mm: 1.2}}
