# shearWaveProcessing -- PASSIVE SWE (natural shear waves, buffer 4).
#
# EXPERIMENTAL FRAMEWORK. Unlike active SWE, passive elastography has no ARF push and no
# pre-push reference: the buffer-4 ultrafast diverging-wave stream is a continuous cine of
# natural (valve-closure) shear waves. This config provides a *starting* recipe on the same
# iq2sws core; the exact filters/parameters/origin handling still need to be TUNED against
# representative passive data (mirroring how the active recipe was optimized in iq2sws).
#
# Key differences from active.yaml:
#   * pipeline.mode = frame_to_frame  (no reference frame; cumulative displacement)
#   * data.file has no {m} (buffer 4 is a single continuous file, one "measurement")
#   * the M-line is drawn on the buffer-4 B-mode itself (no separate image buffer)
#   * focus/r0 is not a physical ARF push -> mode: auto (origin handling is a tuning TODO)
#
# Run:
#   python run.py viz --config configs/passive.yaml <measurement folder>

data:
  root: ""                                  # set by run.py to <folder>/output
  grid_dir: ""
  file: "CombinedData_buffer4_iq.hdf5"      # single continuous passive stream (no {m})
  bmode: "CombinedData_buffer4_iq.hdf5"     # draw the M-line on the passive stream itself
  ecg: null

mline:
  type: manual
  npz: "mlines/passive_mline.npz"           # relative to data.root; auto-drawn if missing (mid-frame)
  n_samples: 250
  offsets: 5                                 # 5 lines x 0.5 mm (report part 2: 1-15 lines change the
  offset_step_mm: 0.5                        # panel little - the wave varies slowly across the line).

focus:
  mode: auto                                # no ARF push; r0 = M-line point nearest the auto-detected
                                            # activity centre (the strongest early displacement), which
                                            # anchors the directional (outward) filter. TODO: a more
                                            # physical passive origin (valve-plane anchor per window).

# --- processing pipeline: DEFAULT since 2026-09-24 (report/passive_methods, parts 1-2) ---
# Velocity (frame-to-frame), band-pass 15-150 Hz, Gaussian 0.6 x 1.2 mm, moving mean 3, 5 M-lines x
# 0.5 mm, no directional filter, no SVD, no CFWI. Part 1: velocity at 15-100/150 Hz gives the most
# readable fronts; the directional filter fabricates tilt. Part 2 (one thing varied at a time):
# spatial smoothing >= 1.5 x 3 mm fabricates bands and the "medium" setting (1.0 x 2.0, mean 5,
# 9 lines) already over-smooths; temporal smoothing and M-line count change little (the signal is
# slow: f50 29 Hz, f90 66 Hz - study/analysis/smoothing_effect_check.py); SVD beyond 1 component
# hurts; CFWI is poor. The previous displacement 10-150 Hz config is frozen in passive_v1.yaml.
pipeline:
  estimator: loupas
  estimator_params: {}
  mode: frame_to_frame                      # passive: no reference; differential displacement
  quantity: velocity                        # report part 1: velocity 15-150 Hz = most readable fronts
  drop_first: 1
  iq_filters: []                            # NO IQ pre-filter: no SVD (report part 2), no slow-time
                                            # low-pass (washes the wavefront out).

  # Band-pass to remove the bulk myocardial wall motion while keeping the shear-wave band; light
  # Gaussian spatial smoothing; light slow-time smoothing. NO directional filter (see below).
  # Sampling rate ~925 Hz (buffer 4).
  field_filters:
    - {name: temporal_bandpass, params: {f_lo: 15, f_hi: 150}}
    - {name: spatial_smooth, params: {sigma_z_mm: 0.6, sigma_x_mm: 1.2}}   # light Gaussian (~= median 1 mm)
    - {name: temporal_moving_mean, params: {window: 3}}

  directional: false                        # SEARCH v2 + MATLAB comparison: the k-omega directional
  directional_mode: leftward                # filter is OFF for passive (it adds reverberation banding and
                                            # biases the apparent speed high). Kept here only as a label;
                                            # ignored while `directional: false`.
  speed: ttp_ransac                         # NB: for a robust passive speed use a normalized-Radon /
                                            # slant-stack fit on the signed M-mode (metrics.slant_stack_speed),
                                            # fitting the wave CENTRE, not the onset (see docs).

# Burst detection uses a FIXED band, independent of pipeline.field_filters, so tuning the
# processing band does not move the detected windows (index-based M-lines stay valid).
detect:
  # [5, 150]. A narrowing to [5, 45] was applied on 2026-09-22 and REVERTED the same day - see
  # the note on the view band below before proposing it again.
  band: [5, 150]                            # Hz, for the along-line energy used to place windows
  quantity: displacement                    # overview quantity used to place windows - fixed,
                                            # independent of pipeline.quantity (all stored windows
                                            # were detected on displacement)

  # Event SELECTION. "energy" keeps the max_events largest bursts and labels them afterwards;
  # "phase" searches the windows label_event labels with (MVC within 150 ms of an R-peak, AVC
  # within 120 ms of the Weissler QS2) and takes the strongest burst inside each, topping up from
  # the energy ranking if fewer are found. Phase mode uses the ECG_trigger R-peaks only - never
  # the logged waveform.
  #
  # Measured where energy ranking lost a closure:
  #   C000000032  energy: MVC@33, other@581, MVC@846, other@1065   (no AVC at all)
  #               phase : MVC@33, AVC@503,   MVC@846, AVC@1069
  #   C000000040  energy: other@158, other@535, MVC@1041
  #               phase : MVC@149,   AVC@532,   MVC@1041
  # In both, the energy peaks fell just OUTSIDE the AVC window and were labelled "other".
  #
  # Switching mode changes which windows are detected, and per-event M-lines are keyed by window
  # INDEX - so changing this invalidates stored per-event lines and they must be redrawn. It is
  # part of the detection cache key for exactly that reason.
  mode: phase

run:
  measurement: 0
  outdir: "swp_passive"                     # relative to data.root -> <folder>/output/swp_passive
  bands: [[5, 150]]

  # THREE processing VIEWS -> one space-time plot per view per window (columns of the montage),
  # used side by side for manual speed estimation. All share the default recipe (velocity,
  # 15-150 Hz, moving mean 3, 5 lines x 0.5 mm, no directional filter) and differ ONLY in the
  # spatial filter: the Gaussian 0.6 x 1.2 mm default may already steepen the wavefront, so the
  # unsmoothed panel and the edge-preserving median are shown next to it. A slope that holds in all
  # three is not a smoothing artefact. Reported speed is the signed-Radon (slant-stack) fit.
  views:
    # A -- the default.
    - name: "velocity bp15-150 gauss0.6 mean3"
      quantity: velocity
      directional: false
      offsets: 5
      offset_step_mm: 0.5
      field_filters:
        - {name: temporal_bandpass, params: {f_lo: 15, f_hi: 150}}
        - {name: spatial_smooth, params: {sigma_z_mm: 0.6, sigma_x_mm: 1.2}}
        - {name: temporal_moving_mean, params: {window: 3}}

    # B -- no spatial smoothing (check that the default does not steepen the front).
    - name: "velocity bp15-150 unsmoothed mean3"
      quantity: velocity
      directional: false
      offsets: 5
      offset_step_mm: 0.5
      field_filters:
        - {name: temporal_bandpass, params: {f_lo: 15, f_hi: 150}}
        - {name: temporal_moving_mean, params: {window: 3}}

    # C -- median 1.0 x 2.0 mm instead of the Gaussian (edge-preserving).
    - name: "velocity bp15-150 median1.0 mean3"
      quantity: velocity
      directional: false
      offsets: 5
      offset_step_mm: 0.5
      field_filters:
        - {name: temporal_bandpass, params: {f_lo: 15, f_hi: 150}}
        - {name: spatial_median, params: {size_z_mm: 1.0, size_x_mm: 2.0}}
        - {name: temporal_moving_mean, params: {window: 3}}
